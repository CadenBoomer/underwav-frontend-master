<div class="card mb-4 p-3 shadow-sm w-100">
  <div class="d-flex">
    <!-- Track cover -->
    <img [src]="track.coverUrl" class="me-3 track-image" alt="cover">

    <!-- Track info -->
    <div class="flex-grow-1">
      <h5 class="mb-1">{{ track.title }}</h5>
      <p class="text-muted mb-2">{{ track.artist }}</p>

      <button class="btn btn-dark btn-sm me-2">Play</button>
      <button class="btn btn-outline-secondary btn-sm">Like</button>
    </div>
  </div>
</div>
