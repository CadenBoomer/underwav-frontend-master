<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">Underwav</div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Start sharing your sound</p>

    <div *ngIf="message" class="auth-message">{{ message }}</div>

    <div class="field-group">
      <label class="field-label">Username</label>
      <input type="text" class="field-input" placeholder="yourname" [(ngModel)]="username">
    </div>

    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" class="field-input" placeholder="you@example.com" [(ngModel)]="email">
    </div>

    <div class="field-group">
      <label class="field-label">Password</label>
      <input type="password" class="field-input" placeholder="••••••••" [(ngModel)]="password">
    </div>

    <button class="auth-btn" (click)="signup()">Create Account</button>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login" class="auth-link">Sign in</a>
    </p>

  </div>
</div>
