<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">Underwav</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your account</p>

    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" class="field-input" placeholder="you@example.com" [(ngModel)]="email">
    </div>

    <div class="field-group">
      <label class="field-label">Password</label>
      <input type="password" class="field-input" placeholder="••••••••" [(ngModel)]="password">
    </div>

    <button class="auth-btn" (click)="login()">Sign In</button>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/signup" class="auth-link">Sign up</a>
    </p>

  </div>
</div>
