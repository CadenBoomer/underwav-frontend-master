<div class="player fixed-bottom d-flex align-items-center justify-content-between px-4 py-2 shadow-lg">

  <!-- Left: Track Info -->
  <div class="d-flex align-items-center gap-3" style="min-width: 200px;">
    <img
      [src]="player.currentTrack()?.coverUrl || '/UnderwavLogo1.png'"
      class="player-cover rounded"
      alt="cover">
    <div class="track-info overflow-hidden">
      <div class="track-title text-truncate">
        {{ player.currentTrack()?.title || 'No track selected' }}
      </div>
      <div class="track-artist text-truncate">
        {{ player.currentTrack()?.artist || '' }}
      </div>
    </div>
  </div>

  <!-- Center: Controls + Progress -->
  <div class="d-flex flex-column align-items-center flex-grow-1 px-4" style="max-width: 600px;">

    <!-- Buttons -->
    <div class="d-flex align-items-center gap-3 mb-1">

      <button class="ctrl-btn" (click)="player.toggleShuffle()"
        [class.active]="player.isShuffled()" title="Shuffle">
        <i class="bi bi-shuffle"></i>
      </button>

      <button class="ctrl-btn" (click)="player.skipPrev()" title="Previous">
        <i class="bi bi-skip-backward-fill"></i>
      </button>

      <button class="ctrl-btn play-btn" (click)="player.togglePlay()">
        <i class="bi" [class.bi-play-fill]="!player.isPlaying()"
           [class.bi-pause-fill]="player.isPlaying()"></i>
      </button>

      <button class="ctrl-btn" (click)="player.skipNext()" title="Next">
        <i class="bi bi-skip-forward-fill"></i>
      </button>

      <button class="ctrl-btn" (click)="player.toggleRepeat()"
        [class.active]="player.repeatMode() !== 'none'" title="Repeat">
        <i class="bi" [class.bi-repeat]="player.repeatMode() !== 'one'"
           [class.bi-repeat-1]="player.repeatMode() === 'one'"></i>
      </button>

    </div>

    <!-- Progress Bar -->
    <div class="d-flex align-items-center gap-2 w-100">
      <span class="time-label">{{ player.formatTime(player.currentTime()) }}</span>
      <input
        type="range"
        class="progress-bar flex-grow-1"
        [min]="0"
        [max]="player.duration() || 0"
        [value]="player.currentTime()"
        (input)="onSeek($event)"
        step="0.1">
      <span class="time-label">{{ player.formatTime(player.duration()) }}</span>
    </div>

  </div>

  <!-- Right: Volume -->
  <div class="d-flex align-items-center gap-2" style="min-width: 150px; justify-content: flex-end;">
    <i class="bi" [class.bi-volume-mute-fill]="player.volume() === 0"
       [class.bi-volume-down-fill]="player.volume() > 0 && player.volume() < 50"
       [class.bi-volume-up-fill]="player.volume() >= 50"></i>
    <input
      type="range"
      class="volume-bar"
      min="0" max="100"
      [value]="player.volume()"
      (input)="onVolume($event)"
      style="width: 90px;">
  </div>

</div>
